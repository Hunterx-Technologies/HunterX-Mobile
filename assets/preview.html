<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HunterX icon preview</title>
<style>
  :root { color-scheme: dark; --o: #FE5B01; }
  body { margin: 0; padding: 32px 16px 64px; background: #0b0b0c; color: #eee; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; } h2 { font-size: 15px; color: var(--o); margin: 36px 0 12px; text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
  figure { margin: 0; text-align: center; } figcaption { margin-top: 8px; color: #999; font-size: 12px; }
  .ios { width: 120px; height: 120px; border-radius: 26.5px; overflow: hidden; }
  .ios img, .sq img { width: 100%; height: 100%; display: block; }
  .sq { width: 120px; height: 120px; outline: 1px dashed #444; }
  .adaptive { width: 120px; height: 120px; overflow: hidden; position: relative; background: #000000; box-shadow: 0 0 0 1px #333; }
  .adaptive img { position: absolute; width: 150%; height: 150%; left: -25%; top: -25%; }
  .circle { border-radius: 50%; } .rounded { border-radius: 16%; } .square { border-radius: 0; }
  .squircle { border-radius: 0; clip-path: path('M60 0C14 0 0 14 0 60s14 60 60 60 60-14 60-60S106 0 60 0Z'); }
  .safe { position: relative; } .safe::after { content: ''; position: absolute; inset: 20px; border-radius: 50%; outline: 1px dashed var(--o); }
  .themed { width: 120px; height: 120px; border-radius: 50%; background: #d7e3ff; position: relative; overflow: hidden; }
  .themed.dark { background: #1f2a3d; }
  .themed i { position: absolute; inset: -25%; background: #1b3a66; -webkit-mask: url(images/adaptive-icon-monochrome.png) center/contain no-repeat; mask: url(images/adaptive-icon-monochrome.png) center/contain no-repeat; }
  .themed.dark i { background: #b8ccff; }
  .thumb img { display: block; border-radius: 22.5%; }
  .bar { width: 320px; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 8px; font-weight: 600; }
  .bar.light { background: #f2f2f2; color: #111; } .bar.dark { background: #111; color: #fff; border: 1px solid #333; }
  .bar i { width: 24px; height: 24px; background: currentColor; -webkit-mask: url(images/notification-icon.png) center/contain no-repeat; mask: url(images/notification-icon.png) center/contain no-repeat; }
  .shade { width: 360px; padding: 12px 14px; border-radius: 16px; background: #1d1d20; display: flex; gap: 12px; align-items: center; }
  .shade .badge { width: 32px; height: 32px; border-radius: 50%; background: var(--o); display: grid; place-items: center; }
  .shade .badge i { width: 20px; height: 20px; background: #fff; -webkit-mask: url(images/notification-icon.png) center/contain no-repeat; mask: url(images/notification-icon.png) center/contain no-repeat; }
  .wide img { max-width: 100%; height: auto; border: 1px solid #222; }
</style></head><body><main>
<h1>HunterX icon preview</h1>
<p>Generated by <code>npm run assets</code>. Check that nothing important is cropped in any shape.</p>

<h2>iOS</h2>
<div class="row">
  <figure><div class="ios"><img src="images/icon.png"></div><figcaption>iOS rounded square</figcaption></figure>
  <figure><div class="ios"><img src="images/icon-dark.png" style="background:#1c1c1e"></div><figcaption>iOS dark</figcaption></figure>
  <figure><div class="ios"><img src="images/icon-tinted.png"></div><figcaption>iOS tinted (source)</figcaption></figure>
  <figure><div class="sq"><img src="images/icon.png"></div><figcaption>Square (App Store file)</figcaption></figure>
  <figure class="thumb"><img src="images/icon.png" width="60" height="60"><figcaption>60px</figcaption></figure>
  <figure class="thumb"><img src="images/icon.png" width="29" height="29"><figcaption>29px</figcaption></figure>
</div>

<h2>Android adaptive icon</h2>
<div class="row">
  <figure><div class="adaptive circle"><img src="images/adaptive-icon-foreground.png"></div><figcaption>Circle</figcaption></figure>
  <figure><div class="adaptive squircle"><img src="images/adaptive-icon-foreground.png"></div><figcaption>Squircle</figcaption></figure>
  <figure><div class="adaptive rounded"><img src="images/adaptive-icon-foreground.png"></div><figcaption>Rounded square</figcaption></figure>
  <figure><div class="adaptive square"><img src="images/adaptive-icon-foreground.png"></div><figcaption>Square</figcaption></figure>
  <figure><div class="adaptive circle safe"><img src="images/adaptive-icon-foreground.png"></div><figcaption>66% safe zone</figcaption></figure>
  <figure><div class="themed"><i></i></div><figcaption>Themed (light)</figcaption></figure>
  <figure><div class="themed dark"><i></i></div><figcaption>Themed (dark)</figcaption></figure>
</div>

<h2>Splash (Android 12+ 192dp circle)</h2>
<div class="row">
  <figure><div class="adaptive circle" style="width:192px;height:192px"><img src="images/splash-icon.png"></div><figcaption>Android 12+ crop</figcaption></figure>
  <figure><div class="sq" style="width:200px;height:200px;background:#000"><img src="images/splash-icon.png"></div><figcaption>iOS, 200px wide on black</figcaption></figure>
</div>

<h2>Notification icon</h2>
<div class="row">
  <figure><div class="bar light"><i></i>9:41</div><figcaption>Light status bar</figcaption></figure>
  <figure><div class="bar dark"><i></i>9:41</div><figcaption>Dark status bar</figcaption></figure>
  <figure><div class="shade"><span class="badge"><i></i></span><span>HunterX · Your streak is on the line</span></div><figcaption>Shade (accent colour)</figcaption></figure>
</div>

<h2>Web</h2>
<div class="row">
  <figure class="thumb"><img src="../../HunterX-Web/hunterx-web/public/favicon-16x16.png" width="16" height="16" style="border-radius:0"><figcaption>16px</figcaption></figure>
  <figure class="thumb"><img src="../../HunterX-Web/hunterx-web/public/favicon-32x32.png" width="32" height="32" style="border-radius:0"><figcaption>32px</figcaption></figure>
  <figure class="thumb"><img src="../../HunterX-Web/hunterx-web/public/apple-touch-icon.png" width="90" height="90"><figcaption>apple-touch-icon</figcaption></figure>
  <figure><div class="adaptive circle" style="background:none"><img src="../../HunterX-Web/hunterx-web/public/maskable-512x512.png" style="width:125%;height:125%;left:-12.5%;top:-12.5%"></div><figcaption>Maskable (80% circle)</figcaption></figure>
  <figure><img src="../../HunterX-Web/hunterx-web/public/safari-pinned-tab.svg" width="64" height="64" style="background:#fff;border-radius:8px;padding:6px"><figcaption>Safari pinned tab</figcaption></figure>
</div>
<div class="row wide" style="margin-top:24px">
  <figure><img src="../../HunterX-Web/hunterx-web/public/og-image.png" width="600"><figcaption>og-image 1200x630</figcaption></figure>
  <figure><img src="store/google/feature-graphic-1024x500.png" width="512"><figcaption>Play feature graphic 1024x500</figcaption></figure>
</div>
</main></body></html>
