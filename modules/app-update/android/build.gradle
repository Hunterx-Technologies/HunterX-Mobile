plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hunterx.mobile'
version = '1.0.0'

android {
  namespace "expo.modules.hunterxappupdate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Google Play in-app updates: the full-screen "Update required" flow.
  implementation 'com.google.android.play:app-update:2.1.0'
}
